# Corre todas las pruebas en cada push y pull request a main.
# Supabase NUNCA se toca: el build usa una dirección y llave falsas y las pruebas interceptan todo.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Build (con Supabase falso)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://prueba.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_prueba

      - name: Pruebas
        run: npm run pruebas
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Guardar resultados si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: pruebas/salida/
          retention-days: 7
